<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCheat网盘</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        /* 背景 + 高斯模糊层 */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('http://pan.cdndns.site/down/65558BCheat') no-repeat center / cover;
            filter: blur(10px);
            transform: scale(1.05);
            z-index: -2;
        }

        /* ❄️ 雪花动画 */
        .snowflake {
            position: fixed;
            width: 40px;
            height: 40px;
            background: url('https://cdn-icons-png.flaticon.com/512/4150/4150897.png') no-repeat center / contain;
            pointer-events: none;
            opacity: 0.9;
            z-index: 10;
        }

        @keyframes fall {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(250px) rotate(90deg) scale(0.8); opacity: 0; }
        }

        /* 🌟 白色悬浮窗 */
        .floating-box {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            text-align: center;
            color: #fff;
            width: 320px;
            transition: all 0.4s ease;
            z-index: 5;
            animation: floatIn 0.8s ease-out;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .header p {
            font-size: 15px;
            margin-top: 8px;
            color: rgba(240,240,255,0.9);
        }

        .btn {
            position: relative;
            display: block;
            width: 200px;
            padding: 12px 0;
            margin: 10px auto;
            background: rgba(74,108,247,0.85);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(100, 130, 255, 0.3);
            animation: glowPulse 2.5s ease-in-out infinite;
        }

        .btn:hover {
            background-color: rgba(58,92,231,0.95);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(130,160,255,0.5);
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(110,140,255,0.4), 0 0 25px rgba(130,100,255,0.2);
            }
            50% {
                box-shadow: 0 0 20px rgba(160,180,255,0.7), 0 0 40px rgba(180,130,255,0.4);
            }
        }

        @media (max-width: 576px) {
            .floating-box {
                width: 90%;
                padding: 30px 20px;
            }
            .btn {
                width: 160px;
                font-size: 14px;
            }
        }
</style>
  </head>
  <body>
    <div id="top-grrk"></div>

    <!-- 🌟 白色悬浮窗 -->
    <div class="floating-box">
        <div class="header">
            <h1>BCheat网盘</h1>
            <p>点击下载️</p>
        </div>

        <!-- 思幻悬浮音乐播放器 -->
        <script src="http://cdn.sihuanyun.com/xfyybfqzdbf/xfyybfq.js"></script>

        <a href="http://wpan.cdndns.site/down/BCheatGL" class="btn" id="btnGlobal">全球服</a>
        <a href="http://wpan.cdndns.site/down/BCheatKR" class="btn" id="btnJPKR">日韩服</a>
        <a href="http://wpan.cdndns.site/down/BCheatTW" class="btn" id="btnTW">台湾服</a>
        <a href="http://wpan.cdndns.site/down/BCheatVN" class="btn" id="btnVN">越南服</a>
    </div>

<script>
    // 点击任意位置出现雪花 ❄️（随机大小、角度、速度、透明度）
    document.body.addEventListener('click', function(e) {
        const snow = document.createElement('span');
        snow.classList.add('snowflake');
        document.body.appendChild(snow);

        const size = Math.random() * 30 + 20;
        const rotate = Math.random() * 360;
        const duration = Math.random() * 1.5 + 1.8;
        const opacity = Math.random() * 0.4 + 0.6;
        const offsetX = (Math.random() - 0.5) * 60;

        snow.style.width = `${size}px`;
        snow.style.height = `${size}px`;
        snow.style.left = `${e.clientX - size / 2}px`;
        snow.style.top = `${e.clientY - size / 2}px`;
        snow.style.transform = `rotate(${rotate}deg)`;
        snow.style.opacity = opacity;

        snow.animate([
            { transform: `translate(0, 0) rotate(${rotate}deg)`, opacity: opacity },
            { transform: `translate(${offsetX}px, 250px) rotate(${rotate + 90}deg) scale(0.8)`, opacity: 0 }
        ], {
            duration: duration * 1000,
            easing: "ease-out",
            fill: "forwards"
        });

        setTimeout(() => snow.remove(), duration * 1000);
    });

    // 按钮点击后跳转
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const url = this.getAttribute('href');
            setTimeout(() => window.location.href = url, 150);
        });
    });
</script>
  </body>
</html>
